name: Actualizar radar

on:
  schedule:
    - cron: "0 11 * * *"       # 6:00am Panama, todos los dias
  workflow_dispatch:            # boton manual en la pestana Actions

permissions:
  contents: write
  issues: write

concurrency:
  group: update-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar lanzamientos
        id: radar
        run: python3 scripts/fetch_music.py

      - name: Commit de datos si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Sin cambios en data/."
          else
            git commit -m "chore: actualizar radar $(date -u +%FT%TZ)"
            git push
          fi

      - name: Avisar si se caen muchas fuentes
        if: steps.radar.outputs.alerta == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SALUD: ${{ steps.radar.outputs.salud }}
        run: |
          gh issue create \
            --title "MUSIC RADAR: fuentes caidas ($(date -u +%F))" \
            --body "@jona2422 el radar bajo a **$SALUD** fuentes. Revisa el campo \`salud\` de \`data/meta.json\` para ver cual fallo." \
            || echo "No se pudo abrir el issue (no bloquea la corrida)."
